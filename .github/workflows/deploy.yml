name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci


      - name: Build
        run: npx tsc && npx vite build
        env:
          VITE_BUILD_ID: ${{ github.sha }}
          VITE_SHARE_API_URL: ${{ secrets.VITE_SHARE_API_URL }}
          VITE_CF_WEB_ANALYTICS_TOKEN: ${{ secrets.VITE_CF_WEB_ANALYTICS_TOKEN }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published build
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_BUILD_ID: ${{ github.sha }}
        run: |
          set -euo pipefail
          version_url="${PAGE_URL%/}/version.json?verify=${EXPECTED_BUILD_ID}"
          for attempt in 1 2 3 4 5; do
            if response="$(curl --fail --silent --show-error --location --retry 2 --retry-delay 2 --retry-all-errors "$version_url")" \
              && printf '%s' "$response" | jq -e --arg expected "$EXPECTED_BUILD_ID" '.buildId == $expected' >/dev/null 2>&1; then
              echo "Published build matches $EXPECTED_BUILD_ID."
              exit 0
            fi
            sleep 5
          done
          echo "GitHub Pages did not expose the expected build marker: $EXPECTED_BUILD_ID" >&2
          exit 1
